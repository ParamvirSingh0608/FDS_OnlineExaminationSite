<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Secured Exam</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', Arial, sans-serif; margin: 0; user-select: none; background: #f4f7f6; }
        .btn { padding: 12px 25px; background: #5a4fcf; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: 600; font-size: 1rem; transition: 0.3s; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn:hover:not(:disabled) { background: #4338ca; }
        .exam-container { padding: 30px; max-width: 800px; margin: 40px auto; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .option { border: 2px solid #e2e8f0; padding: 15px; margin: 10px 0; cursor: pointer; border-radius: 8px; transition: 0.2s; font-size: 1.1rem; }
        .option:hover { background: #f8f9ff; border-color: #cbd5e1; }
        .selected { background: #dfe3ff; border-color: #5a4fcf; font-weight: 600; }
        .timer-box { font-weight: 700; color: #ff4d4d; font-size: 1.2rem; display: flex; align-items: center; background: #fee2e2; padding: 5px 15px; border-radius: 20px; }
        #aiDot { height: 12px; width: 12px; background: #bbb; border-radius: 50%; display: inline-block; margin-right: 10px; }
    </style>
</head>
<body>
    <button id="themeToggle" class="theme-switch" aria-label="Toggle theme">🌙</button>

<div id="startModal" style="position:fixed; width:100%; height:100%; background:white; z-index:1000; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
    <h2 style="font-size: 2rem; color: #333; margin-bottom: 5px;">Security Calibration</h2>
    <p style="color: #666; margin-bottom: 20px;">Please center your face and ensure good lighting.</p>
    <div style="padding: 10px; background: #000; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <video id="video" autoplay muted width="320" height="240" style="border-radius: 10px; transform: scaleX(-1);"></video>
    </div>
    <br>
    <button id="startBtn" class="btn" disabled>Loading AI Models...</button>
    <p id="status" style="margin-top:15px; color:#5a4fcf; font-weight: 600;">Connecting to local models...</p>
</div>

<div id="violationModal" style="display:none; position:fixed; width:100%; height:100%; background:rgba(0,0,0,0.95); color:white; z-index:2000; justify-content:center; align-items:center; flex-direction:column; text-align:center;">
    <h1 style="color:#ff4d4d; font-size: 3.5rem; margin: 0;">⚠️ VIOLATION</h1>
    <p id="reason" style="font-size:1.5rem; margin: 20px 0 40px 0; color: #ccc;"></p>
    <button id="resumeBtn" class="btn" style="background:#ff4d4d; font-size: 1.2rem; padding: 15px 40px;">Acknowledge & Re-enter</button>
</div>

<div id="exam" style="display:none;" class="exam-container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; padding-bottom: 20px; border-bottom: 2px solid #f1f5f9;">
        <h2 id="title" style="margin: 0; color: #1e293b;">Exam in Progress</h2>
        <div class="timer-box">
            <span id="aiDot"></span>
            <span id="time">00:00</span>
        </div>
    </div>

    <div id="examBody">
        <p id="qCount" style="color:#5a4fcf; font-weight:700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;"></p>
        <h3 id="qText" style="font-size: 1.4rem; color: #334155; margin-bottom: 25px;"></h3>
        <div id="options"></div>

        <div style="margin-top:40px; display: flex; justify-content: space-between;">
            <button id="prev" class="btn" style="background:#94a3b8;">&larr; Previous</button>
            <button id="next" class="btn">Next &rarr;</button>
            <button id="submit" class="btn" style="display:none; background:#10b981;">Submit Exam ✅</button>
        </div>
    </div>
</div>

<div id="result" style="display:none; text-align:center; padding-top:100px;">
    <h1 style="font-size:4rem; color:#10b981; margin-bottom: 10px;">Exam Submitted!</h1>
    <p style="font-size: 1.2rem; color: #64748b;">Your responses have been secured and recorded.</p>
    <button class="btn" style="margin-top: 30px;" onclick="window.location.href='user-dashboard.html'">Return to Dashboard</button>
</div>

<script src="JS/face-api.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="JS/theme.js"></script>
<script src="JS/exam.js"></script>
</body>
</html>
